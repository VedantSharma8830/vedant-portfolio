# Deploys the frontend/ folder to GitHub Pages on every push to main.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # If the API_BASE repository variable is set (Settings > Secrets and variables > Actions),
      # point the static site at the deployed backend so the contact form posts to it.
      - name: Point frontend at the deployed backend
        if: ${{ vars.API_BASE != '' }}
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          echo "window.APP_CONFIG = { useApi: true, apiBase: \"$API_BASE\" };" > frontend/js/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
